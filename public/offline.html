<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B63F6" />
    <title>BulkText — Offline</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #142936; background: #F5FAFD; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 520px); background: #fff; border: 1px solid #D9E5EC; border-radius: 20px; padding: 28px; box-shadow: 0 22px 60px rgba(23,49,58,.10); text-align: center; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { margin: 18px 0 8px; }
      p { color: #647784; line-height: 1.55; }
      button { min-height: 44px; border: 1px solid #0B63F6; border-radius: 10px; background: #0B63F6; color: white; padding: 10px 16px; font: inherit; font-weight: 750; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="BulkText" />
      <h1>You’re offline</h1>
      <p>BulkText could not load the app shell from cache. Reconnect to the internet, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
